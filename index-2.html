const groups=[
{name:'Identification & preparation',items:[['VIN / federal data plate','Locate the trailer identification label, verify VIN against registration and fleet record; confirm plate is legible.','VIN must match unit records; record plate damage.','49 CFR 396 Appendix A'],['Inspection setup / securement','Park on firm, level ground; chock against movement; lower landing gear as appropriate. Follow lockout and site procedures; never enter beneath an unsupported or unsecured trailer.','Work cannot proceed safely until secure.','Safety procedure'],['Previous defects','Review prior inspection, unresolved repair items, annual report date, and out-of-service notes.','Do not release unresolved safety deficiencies.','49 CFR 396.3']]},
{name:'Tires & wheels',items:[['Tire tread depths (all positions)','Use a tread gauge in major grooves away from tie bars. Check both edges and center on EACH tire; enter the LOWEST qualifying reading in 32nds of an inch.','At least 2/32 inch on trailer tires. Exposed cords, separation, flat, or audible leaks are unacceptable.','49 CFR 393.75','tread'],['Inflation & tire condition','Measure cold inflation with an accurate gauge; compare to the correct tire/load pressure table. Inspect dual spacing, cuts, sidewalls and valve stems.','No universal pressure is set: use tire maker/load and trailer configuration.','49 CFR 393.75'],['Wheels, fasteners & hubs','Inspect cracked/bent rims, missing/loose studs or nuts, rust trails, hub leaks and overheating signs. Do not torque without verified wheel and fastener spec.','No loose, cracked, broken or missing critical wheel components.','49 CFR 396 Appendix A']]},
{name:'Air drum service brakes',items:[['Brake lining thickness (each wheel)','Through inspection openings or by access per manufacturer, measure lining at shoe center, excluding shoe table/rivets. Measure EACH brake; record minimum measurement.','Non-steering axle air brake lining minimum 1/4 inch (0.25 in) or wear indicator where marked.','49 CFR 393.47(d)','lining'],['Applied pushrod stroke (each chamber)','Secure trailer; identify chamber TYPE and verified rated-stroke designation. Charge reservoir to 80–90 PSI, release parking brakes only when safe/required for test, mark released pushrod, apply full service brakes, measure travel. Never cage a spring brake merely to perform this inspection.','Compare actual measured applied stroke with correct clamp-chamber table. Unknown or unverified chamber = manual review.','49 CFR 393.47(e); 396 Appendix A','stroke'],['Brake drums','Inspect via available openings for cracks, glazing, heat checks, grease contamination and excessive wear; remove for further inspection if required. Measure inside diameter with drum gauge where accessible.','Reject cracks/other Appendix A deficiencies; maximum diameter and minimum wall thickness per drum marking/manufacturer, not a generic number.','49 CFR 396 Appendix A; 393.47(g)'],['Slack adjusters, S-cams & hardware','Inspect slack adjuster mounts, clevis/cotter pins, bushings, rollers, return springs, S-cam movement and equal brake response. Do not mask overstroke by adjusting an automatic slack adjuster.','No broken, missing or insecure parts; correct applied stroke and function.','49 CFR 396 Appendix A'],['Brake chambers & air supply','Inspect brake chamber clamps, pushrods, spring housings, mounting, air lines, gladhand seals and audible leaks. Check service and parking brake apply/release with tractor or approved test rig.','No audible chamber leakage, major hose damage or failed braking response.','49 CFR 396 Appendix A'],['ABS / malfunction lamp','Using tractor or approved ABS test unit, verify trailer ABS lamp initial self-test and normal extinguishing; inspect electrical supply, cable and visible wheel-speed wiring.','Investigate persistent ABS fault; document lamp result.','49 CFR 393.55']]},
{name:'Suspension & axles',items:[['Air springs, shocks and brackets','Inspect air bags for cuts, severe abrasion or leaks; check shocks, torque rods, hangers, pivot bushings, U-bolts and welds.','No broken, displaced or dangerously loose load-bearing parts.','49 CFR 396 Appendix A'],['Axle alignment / wheel ends','Look for unusual tire wear, bent axle parts, oil/grease leakage and abnormal bearing looseness. Perform bearing/endplay measurement only per axle manufacturer.','Manufacturer limits for endplay and alignment.','Manufacturer manual']]},
{name:'Coupling / front',items:[['Kingpin / upper coupler','Clean and visually inspect kingpin neck/shoulder, upper plate, welds and mounting. Gauge kingpin wear at specified locations with correct gauge.','Compare with kingpin/upper coupler maker wear tolerances; no universal limit assigned.','49 CFR 396 Appendix A'],['Air/electrical connection area','Check gladhand mounts/seals, 7-way receptacle, cables, routing and chafing; verify correct service/emergency line identification.','Connections secure, undamaged and leak-free.','49 CFR 393 / Appendix A']]},
{name:'Frame / body',items:[['Frame rails / crossmembers / floor','Inspect structural cracks, corrosion, distorted crossmembers, floor soft spots or holes and loose reinforcement. Check underbody and inside.','No structural defects that compromise safe support or securement.','49 CFR 396 Appendix A'],['Roof / side panels','Inspect holes, loose panels, water damage, bowing and protrusions; photograph problems.','Weather-tight for operations; no dangerous projection or insecure components.','Maintenance standard'],['Landing gear','Cycle legs with trailer properly supported; check gearbox, handle, feet, braces, mounting and lubricant.','Both legs support correctly and stow securely; no cracked supports.','Maintenance standard'],['Sliding tandems / pins','Verify handle/latch action, slide rail condition, stops and every required locking pin fully engaged. Confirm slider is secure before use.','Pins must be positively locked; no severely damaged rails/retainers.','49 CFR 396 Appendix A']]},
{name:'Doors, lights & conspicuity',items:[['Rear swing doors / locking rods','Open/close both doors; inspect hinge pins, rod bearings, cams, keepers, handles, seals and fasteners; verify positive latching with both doors secured.','No unsecured door or hardware likely to fail in service.','49 CFR 393 / maintenance'],['Exterior lighting','Using a tractor or approved test harness, verify all required rear, side marker, clearance, ID, turn, stop and tail lights; inspect lenses/wiring.','Required lamps correctly operating and mounted.','49 CFR 393.9; 393.11'],['Retroreflective tape / reflectors','Inspect required conspicuity material on rear and sides for coverage, damage, obstruction and security.','Meet applicable trailer conspicuity requirements; evaluate by trailer year/configuration.','49 CFR 393.11 / 393.13'],['Mudflaps / guards','Inspect guards, loose fasteners and interference with tires; compare with applicable state requirements.','Secure and compliant with applicable state law.','State requirements']]}
];
let flat=groups.flatMap(g=>g.items.map((a,i)=>({id:g.name+'|'+i,title:a[0],how:a[1],spec:a[2],ref:a[3],type:a[4],group:g.name})));

// Location-specific records. Dual tire positions are separate; a drum brake is one wheel-end per side.
const wheelItems=new Set(['Tire tread depths (all positions)','Inflation & tire condition','Wheels, fasteners & hubs']);
const brakeItems=new Set(['Brake lining thickness (each wheel)','Applied pushrod stroke (each chamber)','Brake drums','Slack adjusters, S-cams & hardware','Brake chambers & air supply']);
function inspectionItems(record=draft){const count=Math.max(1,Math.min(3,Number(record?.axleCount)||2));let result=[];for(const item of flat){

 }}return result}
function statusFor(item,answer){const e=evaluate(item,answer);if(e==='fail')return 'fail';if(answer.status==='fail'||answer.status==='na')return answer.status;if(e==='monitor'&&answer.status==='pass')return 'monitor';return answer.status||''}
function monitorCount(record){return inspectionItems(record).filter(item=>statusFor(item,record.answers?.[item.id]||{})==='monitor').length}

function setAxleCount(value){if(!draft)return;const next=Number(value);if(next===Number(draft.axleCount||2))return;

function tx(s){return h(s).replace(/\n/g,'<br>')};const dbOpen=()=>new Promise((resolve,reject)=>{let r=indexedDB.open('apac-trailer-inspections',1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('inspections',{keyPath:'id'});d.createObjectStore('trailers',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}function getAll(n){return new Promise((a,b)=>{let r=store(n).getAll();r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}function put(n,obj){return new Promise((a,b)=>{let r=store(n,'readwrite').put(obj);r.onsuccess=()=>a();r.onerror=()=>b(r.error)})}function del(n,id){return new Promise((a,b)=>{let r=store(n,'readwrite').delete(id);r.onsuccess=()=>a();r.onerror=()=>b(r.error)})}
function navUI(){for(let id of ['Home','Inspect','Fleet','Records','Info']){$('#nav'+id).classList.toggle('selected',page.toLowerCase()==id.toLowerCase())}}function response(id){return draft?.answers?.[id]||{status:'',value:'',note:'',photos:[]}}function answeredCount(d){return inspectionItems(d).filter(x=>d.answers?.[x.id]?.status).length}function failedCount(d){return inspectionItems(d).filter(x=>statusFor(x,d.answers?.[x.id]||{})==='fail').length}
async function startNew(){draft={id:uid(),created:now(),updated:now(),status:'draft',type:'annual',trailer:'',vin:'',carrier:'APAC Paper',inspector:'',qualification:'',signed:'',axleCount:2,answers:{},repairs:{}};section=0;page='inspect';render()}function setField(k,v){draft[k]=v;scheduleSave()}function scheduleSave(){draft.updated=now();clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>put('inspections',draft),400)}function setAnswer(id,key,v){let o=draft.answers[id]||{status:'',value:'',note:'',photos:[]};o[key]=v;draft.answers[id]=o;scheduleSave();
 if(key==='status'||key==='size'||key==='rated'){renderSection();return}
 if(key==='value'){let item=inspectionItems().find(x=>x.id===id);let el=document.getElementById('eval-'+encodeURIComponent(id));if(el&&item)el.innerHTML=resultText(item,o);
 let status=document.getElementById('status-'+encodeURIComponent(id));if(status&&item){let st=statusFor(item,o);status.className='pill '+(st==='fail'?'fail':st==='monitor'?'monitor':st==='pass'?'pass':'');status.textContent=labelStatus(st)}
 }}
function limits(size,rated){let t={'20':{standard:1.75,long:2,long3:2.5},'24':{standard:1.75,long:2,long3:2.5},'30':{standard:2,long:2.5},'16':{standard:1.75,long:2},'12':{standard:1.375,long:1.75},'36':{standard:2.5}};return t[size]?.[rated]??null}
function evaluate(item,o){let v=Number(o.value);if(o.value===''||o.value===undefined||!Number.isFinite(v)||v<0)return null;
 if(item.type==='tread')return v<2?'fail':v<=4?'monitor':'pass';
 if(item.type==='lining')return v<.25?'fail':v<=.3125?'monitor':'pass';

function fields(item,o){let s='';if(item.type==='stroke'){s+=`<div class="two"><div><label>Chamber type (verify stamping)</label><select onchange="setAnswer('${h(item.id)}','size',this.value)"><option value="">Select</option>${['12','16','20','24','30','36'].map(z=>`<option value="${z}" ${o.size===z?'selected':''}>Type ${z}</option>`).join('')}</select></div><div><label>Rated stroke designation</label><select onchange="setAnswer('${h(item.id)}','rated',this.value)"><option value="">Select verified designation</option><option value="standard" ${o.rated==='standard'?'selected':''}>Standard</option><option value="long" ${o.rated==='long'?'selected':''}>Long stroke</option><option value="long3" ${o.rated==='long3'?'selected':''}>3-inch rated Type 20/24 only</option></select></div></div>`}if(item.type){let unit=item.type==='tread'?'/32 in': 'in';s+=`<div class="two" style="margin:10px 0"><div><label>${item.type==='stroke'?'Applied pushrod stroke':item.type==='tread'?'Lowest measured tread depth':'Minimum lining thickness'} (${unit})</label><input type="number" step="any" min="0" value="${h(o.value)}" oninput="setAnswer('${h(item.id)}','value',this.value)"></div><div><label>Measurement result</label><div class="pill" id="eval-${encodeURIComponent(item.id)}">${resultText(item,o)}</div></div></div>`}return s}
function resultText(item,o){let t=evaluate(item,o);let l=item.type==='stroke'?limits(o.size,o.rated):null;
let words=t==='fail'?'OUTSIDE MEASURED LIMIT — FAIL':t==='monitor'?'WITHIN LIMIT — PASS, MONITOR CLOSELY':t==='pass'?'MEETS MEASURED LIMIT — PASS':'Select verified details / enter measurement';
return `<span class="${t==='fail'?'fail':t==='monitor'?'monitor':t==='pass'?'pass':'warning'}">${words}</span>`+(l!==null?` (max ${l} in)`: '')}
function renderSection(reset=true){if(page!=='inspect')return;const region=$('#checklist');if(!region)return;let g=groups[section],items=inspectionItems().filter(x=>x.group===g.name);
 region.innerHTML=`<div class="row spread"><h3>${section+1}. ${h(g.name)}</h3><span class="pill">${section+1} / ${groups.length}</span></div>${items.map(item=>{let o=response(item.id),st=statusFor(item,o);
return `<div class="item"><div class="row spread"><div class="itemhead">${h(item.title)}</div><span id="status-${encodeURIComponent(item.id)}" class="pill ${st==='fail'?'fail':st==='monitor'?'monitor':st==='pass'?'pass':''}">${labelStatus(st)}</span></div>${item.location?`<div class="location">${h(item.location)}</div>`:''}<details><summary class="small" style="cursor:pointer;margin:8px 0;color:#b4d9f1">How to inspect • tools / limits • citation</summary><div class="guide"><b>Procedure:</b> ${h(item.how)}<br><br><b>Acceptance / limits:</b> ${h(item.spec)}<br><b>Reference:</b> ${h(item.ref)}</div></details>${fields(item,o)}<div class="row noprint"><button ${o.status==='pass'?'class="selected"':''} onclick="setAnswer('${h(item.id)}','status','pass')">✓ Pass</button><button ${o.status==='monitor'?'class="selected"':''} onclick="setAnswer('${h(item.id)}','status','monitor')">⚠ Pass – Monitor</button><button ${o.status==='fail'?'class="selected"':''} onclick="setAnswer('${h(item.id)}','status','fail')">✕ Fail</button><button ${o.status==='na'?'class="selected"':''} onclick="setAnswer('${h(item.id)}','status','na')">N/A</button><button onclick="setAnswer('${h(item.id)}','status','')">Clear</button></div><div style="margin-top:10px"><label>Notes / deficiencies / measurement location</label><textarea oninput="setAnswer('${h(item.id)}','note',this.value)">${h(o.note)}</textarea></div><div class="row noprint"><label style="margin:0">Add photo (camera/gallery)</label><input style="width:220px" type="file" accept="image/*" capture="environment" onchange="addPhoto('${h(item.id)}',this)"></div><div>${(o.photos||[]).map((p,j)=>`<img class="photo" src="${p}" alt="Defect photo"><button class="noprint" onclick="removePhoto('${h(item.id)}',${j})">Remove photo ${j+1}</button>`).join('')}</div></div>`}).join('')}<div class="row spread noprint"><button onclick="section=Math.max(0,section-1);render()" ${section===0?'disabled':''}>← Previous</button>${section===groups.length-1?'<button class="primary" onclick="complete()">Finish &amp; Generate Report →</button>':'<button class="primary" onclick="section=Math.min(groups.length-1,section+1);render()">Next section →</button>'}</div>`;
}
async function addPhoto(id,inp){let f=inp.files?.[0];if(!f)return;let data=await compress(f);let o=draft.answers[id]||{status:'',value:'',note:'',photos:[]};o.photos=o.photos||[];o.photos.push(data);draft.answers[id]=o;await put('inspections',draft);render()}function compress(file){return new Promise((a,b)=>{let img=new Image(),reader=new FileReader();reader.onload=()=>{img.onload=()=>{let scale=Math.min(1,1100/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);a(c.toDataURL('image/jpeg',.7))};img.onerror=b;img.src=reader.result};reader.onerror=b;reader.readAsDataURL(file)})}function removePhoto(id,j){draft.answers[id].photos.splice(j,1);scheduleSave();render()}
function metadata(){return `<div class="grid"><div><label>Trailer axles</label><select onchange="setAxleCount(this.value)"><option value="1" ${Number(draft.axleCount||2)===1?'selected':''}>1 axle</option><option value="2" ${Number(draft.axleCount||2)===2?'selected':''}>2 axles (tandem)</option><option value="3" ${Number(draft.axleCount||2)===3?'selected':''}>3 axles (tridem)</option></select></div><div><label>Inspection type</label><select onchange="setField('type',this.value)"><option value="annual" ${draft.type==='annual'?'selected':''}>Annual DOT periodic inspection</option><option value="routine" ${draft.type==='routine'?'selected':''}>Routine maintenance inspection</option></select></div><div><label>Trailer number *</label><input value="${h(draft.trailer)}" placeholder="e.g. 102" oninput="setField('trailer',this.value)"></div><div><label>Trailer VIN *</label><input value="${h(draft.vin)}" placeholder="17-character VIN" oninput="setField('vin',this.value)"></div><div><label>Motor carrier / operator *</label><input value="${h(draft.carrier)}" oninput="setField('carrier',this.value)"></div><div><label>Inspector full name *</label><input value="${h(draft.inspector)}" oninput="setField('inspector',this.value)"></div><div><label>Annual inspector qualification reference</label><input value="${h(draft.qualification)}" placeholder="Training/experience record ID" oninput="setField('qualification',this.value)"></div></div>`}
function renderInspect(){let total=inspectionItems().length,done=answeredCount(draft),bad=failedCount(draft),watch=monitorCount(draft);$('#app').innerHTML=`<div class="card"><div class="row spread"><h2 class="heading">${draft.status==='complete'?'Completed inspection':'Inspection in progress'}</h2><span class="pill">${h(draft.type.toUpperCase())}</span></div>${metadata()}<div style="margin-top:14px" class="row spread"><b>${done} of ${total} checked</b><span class="${bad?'fail':'muted'}">${bad} failed · <span class="monitor">${watch} monitor</span></span></div><div class="progress"><div style="width:${100*done/total}%"></div></div><p class="notice">For an annual DOT report, every applicable item must be evaluated and the qualified inspector must certify it. This app is a documentation aid, not an authorization to conduct inspections.</p></div><div class="card"><div class="row noprint" style="margin-bottom:14px"><label style="margin:0">Jump to section</label><select class="compact" onchange="section=Number(this.value);render()">${groups.map((g,i)=>`<option value="${i}" ${i===section?'selected':''}>${i+1}. ${h(g.name)}</option>`).join('')}</select></div><div id="checklist"></div></div><div class="card"><h3>Inspection sign-off</h3><label>Certification / signature (type full name)</label><input value="${h(draft.signed)}" oninput="setField('signed',this.value)" placeholder="Inspector attests to report accuracy and completeness"><div class="row noprint" style="margin-top:15px"><button onclick="saveDraft()">Save draft</button><button class="primary" onclick="complete()">Finish &amp; Generate Report</button></div></div>`;renderSection()}
async function saveDraft(){await put('inspections',draft);alert('Draft saved on this device. Export backups regularly.')}async function complete(){let all=inspectionItems(),missing=all.filter(x=>!response(x.id).status);
 if(!draft.trailer.trim()||!draft.vin.trim()||!draft.inspector.trim()||!draft.carrier.trim()||!draft.signed.trim())return alert('Complete trailer number, VIN, inspector, motor carrier and signature first.');
 if(missing.length)return alert(`You still have ${missing.length} unanswered checklist positions/items. Use Jump to section to finish.`);
 if(draft.type==='annual'&&!draft.qualification.trim())return alert('Enter the inspector qualification reference for an annual DOT report.');
 for(let item of all.filter(x=>x.type)){let o=response(item.id),e=evaluate(item,o);
 if(['pass','monitor'].includes(o.status)&&e==='fail')return alert(`${item.title} (${item.location||''}): measurement violates the configured limit; cannot mark PASS.`);
 if(['pass','monitor'].includes(o.status)&&e===null)return alert(`${item.title} (${item.location||''}): enter the measurement and verify any chamber identification before PASS.`)}
 draft.status=failedCount(draft)?'failed':'complete';draft.completed=now();draft.updated=now();clearTimeout(autosaveTimer);await put('inspections',draft);page='report';render()}
function reportTable(r,print=false){let items=inspectionItems(r),watch=items.filter(x=>statusFor(x,r.answers?.[x.id]||{})==='monitor');
 let failures=items.filter(x=>statusFor(x,r.answers?.[x.id]||{})==='fail');
 let rows=items.map(item=>{let o=r.answers?.[item.id]||{},st=statusFor(item,o);
 return `<tr><td>${h(item.group)}<br><b>${h(item.title)}</b>${item.location?`<br>${h(item.location)}`:''}</td><td>${h(labelStatus(st))}</td><td>${h(o.value??'')}${o.value!==''&&o.value!==undefined?(item.type==='tread'?' /32 in':item.type?' in':''):''}${item.type==='stroke'?`<br>Chamber ${h(o.size||'?')}, ${h(o.rated||'?')}`:''}</td><td>${tx(o.note||'')}${(o.photos||[]).map(p=>`<div><img src="${p}" style="max-width:125px;max-height:100px"></div>`).join('')}</td></tr>`}).join('');
let highlights=(list,empty)=>list.length?`<table class="reportTable"><thead><tr><th>Component &amp; Location</th><th>Result / reading</th><th>Follow-up</th></tr></thead><tbody>${list.map(item=>{let o=r.answers?.[item.id]||{};return `<tr><td>${h(item.title)}${item.location?`<br>${h(item.location)}`:''}</td><td>${h(labelStatus(statusFor(item,o)))}${o.value!==''&&o.value!==undefined?` · ${h(o.value)} ${item.type==='tread'?'/32 in':item.type?'in':''}`:''}</td><td>${tx(o.note|| (statusFor(item,o)==='monitor'?'Recheck at next scheduled service; monitor trend.':'Repair and document correction before returning to service as required.'))}</td></tr>`}).join('')}</tbody></table>`:`<p>${empty}</p>`;
 return `<h1>APAC · Trailer Inspection Report</h1><p><b>Inspection:</b> ${h(r.type==='annual'?'Annual DOT periodic':'Routine maintenance')} &nbsp; <b>Result:</b> ${h(r.status.toUpperCase())} &nbsp; <b>Date:</b> ${h(new Date(r.completed||r.created).toLocaleString())}</p><p><b>Trailer:</b> ${h(r.trailer)} &nbsp; <b>VIN:</b> ${h(r.vin)} &nbsp; <b>Axles:</b> ${h(r.axleCount||2)} &nbsp; <b>Carrier:</b> ${h(r.carrier)}</p><p><b>Inspector:</b> ${h(r.inspector)} &nbsp; <b>Qualification reference:</b> ${h(r.qualification)} &nbsp; <b>Signed:</b> ${h(r.signed)}</p><p><b>Items:</b> ${answeredCount(r)} / ${items.length} &nbsp; <b>Failures:</b> ${failures.length} &nbsp; <b>Pass – Monitor:</b> ${watch.length}</p><h2>Items Requiring Monitoring</h2>${highlights(watch,'No items marked for monitoring.')}<h2>Failed Items / Repairs Required</h2>${highlights(failures,'No failed items recorded.')}<h2>Complete Inspection Checklist</h2><table class="reportTable"><thead><tr><th>Inspection Item / Position</th><th>Result</th><th>Measurement</th><th>Notes / Photos</th></tr></thead><tbody>${rows}</tbody></table><p><b>Inspector certification:</b> ${h(r.signed||'Not signed')} &nbsp; <b>Date:</b> ${h(new Date(r.completed||r.created).toLocaleDateString())}</p><p style="font-size:12px">Pass – Monitor is a preventive maintenance advisory, not a separate DOT regulatory category. Inspector must confirm all applicable requirements and repairs. Retain the periodic inspection report in accordance with 49 CFR 396.21.</p>`}
async function render(){navUI();if(page==='report'){if(!draft)return page='records',render();$('#app').innerHTML=`<div class="card noprint"><h2>Inspection report generated</h2><p class="muted">Review the report below, then print it or use your browser's Save as PDF option.</p><div class="row"><button class="primary" onclick="printRecord('${draft.id}')">Print / Save as PDF</button><button onclick="page='records';render()">All records</button></div></div><div class="card" id="reportPreview">${reportTable(draft)}</div>`;return}if(page==='inspect'){renderInspect();return}if(page==='home'){let rec=await getAll('inspections'),fleet=await getAll('trailers');$('#app').innerHTML=`<h2 class="heading">Inspection dashboard</h2><div class="grid"><div class="card"><div class="muted">Trailers recorded</div><h2>${fleet.length}</h2></div><div class="card"><div class="muted">Saved inspections</div><h2>${rec.length}</h2></div><div class="card"><div class="muted">Unfinished reports</div><h2>${rec.filter(x=>x.status==='draft').length}</h2></div><div class="card"><div class="muted">Reports with failures</div><h2>${rec.filter(x=>failedCount(x)).length}</h2></div></div><div class="card"><h3>Start your inspection</h3><p>Annual DOT periodic or routine maintenance. Guided instructions and measurements for air drum brake trailers.</p><button class="primary" onclick="startNew()">+ Start inspection</button></div><div class="card"><h3>Recent records</h3>${rec.sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,6).map(x=>`<div class="item row spread"><span>Trailer ${h(x.trailer||'Unassigned')} · ${h(x.type)} · ${h(x.status)}</span><button onclick="openRecord('${x.id}')">Open</button></div>`).join('')||'<p class="muted">No inspections yet.</p>'}</div>`;return}if(page==='fleet'){let f=await getAll('trailers');$('#app').innerHTML=`<h2 class="heading">Trailer fleet</h2><div class="card"><div class="two"><div><label>Unit number</label><input id="fleetUnit" placeholder="Trailer 102"></div><div><label>VIN</label><input id="fleetVin" placeholder="VIN"></div><div><label>Make / model</label><input id="fleetMake"></div><div><label>Year</label><input id="fleetYear" type="number"></div></div><div style="margin-top:10px"><button class="primary" onclick="addTrailer()">Add trailer</button></div></div><div class="card">${f.map(x=>`<div class="item row spread"><span><b>${h(x.id)}</b> · ${h(x.vin)} · ${h(x.make||'')} ${h(x.year||'')}</span><span><button onclick="inspectTrailer('${h(x.id)}')">Inspect</button> <button onclick="removeTrailer('${h(x.id)}')">Delete</button></span></div>`).join('')||'No trailers added.'}</div>`;return}if(page==='records'){let r=await getAll('inspections');$('#app').innerHTML=`<h2 class="heading">Saved reports & backups</h2><div class="card"><div class="row"><button class="primary" onclick="backup()">Export complete JSON backup</button><label class="btn" style="margin:0;cursor:pointer">Restore JSON backup <input type="file" accept="application/json,.json" style="display:none" onchange="restore(this)"></label></div><p class="small muted">Stored on this browser/device only. Clearing browser data can erase these records. Save backups to managed company storage. Restoring merges by record ID and overwrites matching IDs.</p></div><div class="card">${r.sort((a,b)=>b.updated.localeCompare(a.updated)).map(x=>`<div class="item row spread"><span><b>Trailer ${h(x.trailer||'—')}</b><br><span class="small muted">${h(x.type)} | ${new Date(x.created).toLocaleString()} | ${h(x.status)} | ${failedCount(x)} failures</span></span><span><button onclick="openRecord('${x.id}')">Open</button> <button onclick="printRecord('${x.id}')">Print/PDF</button> <button onclick="deleteRecord('${x.id}')">Delete</button></span></div>`).join('')||'<p>No inspections recorded.</p>'}</div>`;return}if(page==='info'){$('#app').innerHTML=`<h2 class="heading">Standards, use and limitations</h2><div class="card"><h3>Inspection scope</h3><p>Configured for dry van semi-trailers with air drum brakes. Annual DOT periodic reports follow Appendix A to Part 396 as the minimum baseline. Routine inspections can include additional fleet-maintenance items.</p><p>Federal annual periodic inspections must be performed by a qualified inspector, at least every 12 months. Keep annual reports for at least 14 months and maintain inspector qualification evidence as required.</p><p>Brake chamber table applies only to identified clamp-type chambers. Special 3-inch rated Type 20 / Type 24 chambers have distinct limits. Never assume the type or rated stroke. For unknown brake configuration, obtain manufacturer data and mark for further review.</p><p><b>Required records:</b> Annual DOT reports identify inspector, motor carrier, date, trailer, components/results, and inspector certification. Electronic records should be backed up and accessible for production to officials.</p><h3>Primary official/reference sources</h3><p><a target="_blank" href="https://www.ecfr.gov/current/title-49/subtitle-B/chapter-III/subchapter-B/part-396/appendix-Appendix%20A%20to%20Part%20396">49 CFR 396 Appendix A</a><br><a target="_blank" href="https://www.ecfr.gov/current/title-49/section-393.47">49 CFR 393.47 — Brakes</a><br><a target="_blank" href="https://www.ecfr.gov/current/title-49/section-393.75">49 CFR 393.75 — Tires</a><br><a target="_blank" href="https://www.ecfr.gov/current/title-49/section-396.17">49 CFR 396.17 — Periodic inspections</a><br><a target="_blank" href="https://www.ecfr.gov/current/title-49/section-396.19">49 CFR 396.19 — Inspector qualifications</a><br><a target="_blank" href="https://www.ecfr.gov/current/title-49/section-396.21">49 CFR 396.21 — Recordkeeping</a></p><p class="notice">Not a DVIR substitute, government-approved inspection certificate, roadside out-of-service classifier, or certified inspection training course. Manufacturer limits and fleet configuration must be verified. Monitoring is a maintenance advisory: tread 2–4/32 in, lining 0.25–0.3125 in, and chamber stroke within 1/8 in of its configured maximum. These are not additional legal limits. Measurements at regulatory thresholds must be reviewed by the qualified inspector.</p></div>`}}
async function addTrailer(){let id=$('#fleetUnit').value.trim(),vin=$('#fleetVin').value.trim();if(!id||!vin)return alert('Unit and VIN required.');await put('trailers',{id,vin,make:$('#fleetMake').value,year:$('#fleetYear').value});render()}async function inspectTrailer(id){let t=(await getAll('trailers')).find(x=>x.id===id);await startNew();draft.trailer=t.id;draft.vin=t.vin;render();scheduleSave()}async function removeTrailer(id){if(confirm('Delete trailer fleet entry? Past inspection records remain.')){await del('trailers',id);render()}}async function openRecord(id){let r=(await getAll('inspections')).find(x=>x.id===id);if(!r)return;draft=r;section=0;page='inspect';render()}async function deleteRecord(id){if(confirm('Permanently delete this inspection from this device?')){await del('inspections',id);render()}}
async function printRecord(id){let w=window.open('','_blank');if(!w)return alert('Please allow pop-ups to print the inspection.');
 try{let r=(await getAll('inspections')).find(x=>x.id===id);if(!r){w.close();return alert('Report not found.')}
 w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>APAC DOT - ${h(r.trailer)}</title><style>body{font:12px Arial,sans-serif;color:#111;padding:18px}h1{font-size:21px;border-bottom:3px solid #b82d36;padding-bottom:8px}h2{font-size:16px;margin-top:24px}p{line-height:1.5}.reportTable{border-collapse:collapse;width:100%;margin:9px 0 16px}.reportTable th,.reportTable td{border:1px solid #888;padding:6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}.reportTable th{background:#eee}tr{break-inside:avoid}thead{display:table-header-group}img{max-width:125px;max-height:100px}@page{size:letter;margin:.45in}</style></head><body>${reportTable(r,true)}</body></html>`);
 w.document.close();w.onload=()=>{w.focus();w.print()};setTimeout(()=>{try{w.focus();w.print()}catch(e){}},700)}catch(e){w.close();alert('Unable to print: '+e.message)}}
async function backup(){let payload={app:'APAC Trailer Inspection',version:2,exported:now(),inspections:await getAll('inspections'),trailers:await getAll('trailers')};let blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='APAC-Trailer-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function restore(inp){let f=inp.files?.[0];if(!f)return;try{let b=JSON.parse(await f.text());if(b.app!=='APAC Trailer Inspection'||!Array.isArray(b.inspections)||!Array.isArray(b.trailers))throw Error('Invalid format');if(!confirm(`Import ${b.inspections.length} inspections and ${b.trailers.length} trailers? Matching IDs will be overwritten.`))return;for(let t of b.trailers)await put('trailers',t);for(let r of b.inspections)await put('inspections',r);alert('Backup restored.');render()}catch(e){alert('Restore failed: '+e.message)}}
