:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#eaf1f8;background:#0c1521}*{box-sizing:border-box}body{margin:0}.top{background:#16263b;padding:16px 20px;border-bottom:3px solid #cc3539;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:21px;letter-spacing:.3px}.sub{font-size:12px;color:#bac8d7}.wrap{max-width:1060px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}button,.btn{background:#20354d;color:#fff;border:1px solid #45617d;padding:11px 14px;border-radius:9px;font-weight:600;cursor:pointer}button:hover{background:#2c4968}.primary{background:#b82d36;border-color:#db4b55}.primary:hover{background:#d03540}.selected{outline:2px solid #88bdec}.danger{color:#ffaaaa}.muted{color:#a6b7c9}.small{font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#142336;border:1px solid #334a62;border-radius:13px;padding:17px;margin-bottom:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.heading{font-size:23px;margin:0 0 13px}label{display:block;font-size:13px;color:#c2cfdd;margin-bottom:6px}input,select,textarea{display:block;background:#0e1b2b;color:white;border:1px solid #52677c;border-radius:8px;padding:11px;width:100%;font:inherit}input[type=file]{padding:8px}textarea{min-height:75px}h3{margin:7px 0 12px}.item{border-top:1px solid #34485f;padding:15px 0}.item:first-child{border-top:0}.itemhead{font-weight:750;font-size:16px}.guide{border-left:3px solid #5a9fc8;background:#102539;padding:11px;margin:11px 0;line-height:1.45;font-size:14px}.pill{padding:5px 9px;border-radius:100px;background:#243951;font-size:12px}.pass{color:#76e0a2}.fail{color:#ff9b98}.warning{color:#f8d78d}.photo{max-width:110px;max-height:95px;border-radius:7px;margin:7px;border:1px solid #52677c}.status{font-weight:750}.progress{height:9px;background:#2c3d50;border-radius:100px;overflow:hidden </style></head><body><header class="top"><div><div class="brand">APAC <span style="color:#f07880">|</span> Trailer Inspections</div><div class="sub">Guided dry van inspections · Local-first records · v1.0</div></div><span id="offline" class="pill">Checking connection</span></header><main class="wrap"><nav class="tabs noprint"><button id="navHome" onclick="page='home';render()">Dashboard</button><button id="navInspect" onclick="startNew()">New inspection</button><button id="navFleet" onclick="page='fleet';render()">Trailer fleet</button><button id="navRecords" onclick="page='records';render()">Records / backup</button><button id="navInfo" onclick="page='info';render()">Standards / help</button></nav><div id="app"></div><div class="footer noprint">APAC inspection assistant. Annual inspections require a qualified inspector and independent compliance review. Locally stored data is not yet synchronized to other devices.</div></main>

'use strict';let page='home',draft=null,section=0,db,autosaveTimer=null;const $=s=>document.querySelector(s);const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>new Date().toISOString(),uid=()=>('i'+Date.now()+Math.random().toString(36).slice(2,7));
const groups=[
{name:'Identification & preparation',items:[['VIN / federal data plate','Locate the trailer identification label, verify VIN against registration and fleet record; confirm plate is legible.','VIN must match unit records; record plate damage.','49 CFR 396 Appendix A'],['Inspection setup / securement','Park on firm, level ground; chock against movement; lower landing gear as appropriate. Follow lockout and site procedures; never enter beneath an unsupported or unsecured trailer.','Work cannot proceed safely until secure.','Safety procedure'],['Previous defects','Review prior inspection, unresolved repair items, annual report date, and out-of-service notes.','Do not release unresolved safety deficiencies.','49 CFR 396.3']]},
{name:'Tires & wheels',items:[['Tire tread depths (all positions)','Use a tread gauge in major grooves away from tie bars. Check both edges and center on EACH tire; enter the LOWEST qualifying reading in 32nds of an inch.','At least 2/32 inch on trailer tires. Exposed cords, separation, flat, or audible leaks are unacceptable.','49 CFR 393.75','tread'],['Inflation & tire condition','Measure cold inflation with an accurate gauge; compare to the correct tire/load pressure table. Inspect dual spacing, cuts, sidewalls and valve stems.','No universal pressure is set: use tire maker/load and trailer configuration.','49 CFR 393.75'],['Wheels, fasteners & hubs','Inspect cracked/bent rims, missing/loose studs or nuts, rust trails, hub leaks and overheating signs. Do not torque without verified wheel and fastener spec.','No loose, cracked, broken or missing critical wheel components.','49 CFR 396 Appendix A']]},
{name:'Air drum service brakes',items:[['Brake lining thickness (each wheel)','Through inspection openings or by access per manufacturer, measure lining at shoe center, excluding shoe table/rivets. Measure EACH brake; record minimum measurement.','Non-steering axle air brake lining minimum 1/4 inch (0.25 in) or wear indicator where marked.','49 CFR 393.47(d)','lining'],['Applied pushrod stroke (each chamber)','Secure trailer; identify chamber TYPE and verified rated-stroke designation. Charge reservoir to 80–90 PSI, release parking brakes only when safe/required for test, mark released pushrod, apply full service brakes, measure travel. Never cage a spring brake merely to perform this inspection.','Compare actual measured applied stroke with correct clamp-chamber table. Unknown or unverified chamber = manual review.','49 CFR 393.47(e); 396 Appendix A','stroke'],['Brake drums','Inspect via available openings for cracks, glazing, heat checks, grease contamination and excessive wear; remove for further inspection if required. Measure inside diameter with drum gauge where accessible.','Reject cracks/other Appendix A deficiencies; maximum diameter and minimum wall thickness per drum marking/manufacturer, not a generic number.','49 CFR 396 Appendix A; 393.47(g)'],['Slack adjusters, S-cams & hardware','Inspect slack adjuster mounts, clevis/cotter pins, bushings, rollers, return springs, S-cam movement and equal brake response. Do not mask overstroke by adjusting an automatic slack adjuster.','No broken, missing or insecure parts; correct applied stroke and function.','49 CFR 396 Appendix A'],['Brake chambers & air supply','Inspect brake chamber clamps, pushrods, spring housings, mounting, air lines, gladhand seals and audible leaks. Check service and parking brake apply/release with tractor or approved test rig.','No audible chamber leakage, major hose damage or failed braking response.','49 CFR 396 Appendix A'],['ABS / malfunction lamp','Using tractor or approved ABS test unit, verify trailer ABS lamp initial self-test and normal extinguishing; inspect electrical supply, cable and visible wheel-speed wiring.','Investigate persistent ABS fault; document lamp result.','49 CFR 393.55']]},
{name:'Suspension & axles',items:[['Air springs, shocks and brackets','Inspect air bags for cuts, severe abrasion or leaks; check shocks, torque rods, hangers, pivot bushings, U-bolts and welds.','No broken, displaced or dangerously loose load-bearing parts.','49 CFR 396 Appendix A'],['Axle alignment / wheel ends','Look for unusual tire wear, bent axle parts, oil/grease leakage and abnormal bearing looseness. Perform bearing/endplay measurement only per axle manufacturer.','Manufacturer limits for endplay and alignment.','Manufacturer manual']]},
{name:'Coupling / front',items:[['Kingpin / upper coupler','Clean and visually inspect kingpin neck/shoulder, upper plate, welds and mounting. Gauge kingpin wear at specified locations with correct gauge.','Compare with kingpin/upper coupler maker wear tolerances; no universal limit assigned.','49 CFR 396 Appendix A'],['Air/electrical connection area','Check gladhand mounts/seals, 7-way receptacle, cables, routing and chafing; verify correct service/emergency line identification.','Connections secure, undamaged and leak-free.','49 CFR 393 / Appendix A']]},
{name:'Frame / body',items:[['Frame rails / crossmembers / floor','Inspect structural cracks, corrosion, distorted crossmembers, floor soft spots or holes and loose reinforcement. Check underbody and inside.','No structural defects that compromise safe support or securement.','49 CFR 396 Appendix A'],['Roof / side panels','Inspect holes, loose panels, water damage, bowing and protrusions; photograph problems.','Weather-tight for operations; no dangerous projection or insecure components.','Maintenance standard'],['Landing gear','Cycle legs with trailer properly supported; check gearbox, handle, feet, braces, mounting and lubricant.','Both legs support correctly and stow securely; no cracked supports.','Maintenance standard'],['Sliding tandems / pins','Verify handle/latch action, slide rail condition, stops and every required locking pin fully engaged. Confirm slider is secure before use.','Pins must be positively locked; no severely damaged rails/retainers.','49 CFR 396 Appendix A']]},
{name:'Doors, lights & conspicuity',items:[['Rear swing doors / locking rods','Open/close both doors; inspect hinge pins, rod bearings, cams, keepers, handles, seals and fasteners; verify positive latching with both doors secured.','No unsecured door or hardware likely to fail in service.','49 CFR 393 / maintenance'],['Exterior lighting','Using a tractor or approved test harness, verify all required rear, side marker, clearance, ID, turn, stop and tail lights; inspect lenses/wiring.','Required lamps correctly operating and mounted.','49 CFR 393.9; 393.11'],['Retroreflective tape / reflectors','Inspect required conspicuity material on rear and sides for coverage, damage, obstruction and security.','Meet applicable trailer conspicuity requirements; evaluate by trailer year/configuration.','49 CFR 393.11 / 393.13'],['Mudflaps / guards','Inspect guards, loose fasteners and interference with tires; compare with applicable state requirements.','Secure and compliant with applicable state law.','State requirements']]}
];
let flat=groups.flatMap(g=>g.items.map((a,i)=>({id:g.name+'|'+i,title:a[0],how:a[1],spec:a[2],ref:a[3],type:a[4],group:g.name})));
function tx(s){return h(s).replace(/\n/g,'<br>')};const dbOpen=()=>new Promise((resolve,reject)=>{let r=indexedDB.open('apac-trailer-inspections',1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('inspections',{keyPath:'id'});d.createObjectStore('trailers',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}function getAll(n){return new Promise((a,b)=>{let r=store(n).getAll();r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}function put(n,obj){return new Promise((a,b)=>{let r=store(n,'readwrite').put(obj);r.onsuccess=()=>a();r.onerror=()=>b(r.error)})}function del(n,id){return new Promise((a,b)=>{let r=store(n,'readwrite').delete(id);r.onsuccess=()=>a();r.onerror=()=>b(r.error)})}
function navUI(){for(let id of ['Home','Inspect','Fleet','Records','Info']){$('#nav'+id).classList.toggle('selected',page.toLowerCase()==id.toLowerCase())}}function response(id){return draft?.answers?.[id]||{status:'',value:'',note:'',photos:[]}}function answeredCount(d){return Object.values(d.answers||{}).filter(x=>x.status).length}function failedCount(d){return Object.values(d.answers||{}).filter(x=>x.status==='fail').length}
async function startNew(){draft={id:uid(),created:now(),updated:now(),status:'draft',type:'annual',trailer:'',vin:'',carrier:'APAC Paper',inspector:'',qualification:'',signed:'',answers:{},repairs:{}};section=0;page='inspect';render()}function setField(k,v){draft[k]=v;scheduleSave()}function scheduleSave(){draft.updated=now();clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>put('inspections',draft),400)}function setAnswer(id,key,v){let o=draft.answers[id]||{status:'',value:'',note:'',photos:[]};o[key]=v;draft.answers[id]=o;scheduleSave();if(key==='status'||key==='size'||key==='rated')renderSection();else if(key==='value'){let item=flat.find(x=>x.id===id);let el=document.getElementById('eval-'+flat.indexOf(item));if(el)el.innerHTML=resultText(item,o)}}
function limits(size,rated){let t={'20':{standard:1.75,long:2,long3:2.5},'24':{standard:1.75,long:2,long3:2.5},'30':{standard:2,long:2.5},'16':{standard:1.75,long:2},'12':{standard:1.375,long:1.75},'36':{standard:2.5}};return t[size]?.[rated]??null}
function evaluate(item,o){let v=Number(o.value);if(!o.value||!Number.isFinite(v)||v<0)return null;if(item.type==='tread')return v<2?'fail':'pass';if(item.type==='lining')return v<.25?'fail':'pass';if(item.type==='stroke'){let l=limits(o.size,o.rated);return l===null?null:v>l?'fail':'pass'}return null}
function fields(item,o){let s='';if(item.type==='stroke'){s+=`<div class="two"><div><label>Chamber type (verify stamping)</label><select onchange="setAnswer('${h(item.id)}','size',this.value)"><option value="">Select</option>${['12','16','20','24','30','36'].map(z=>`<option value="${z}" ${o.size===z?'selected':''}>Type ${z}</option>`).join('')}</select></div><div><label>Rated stroke designation</label><select onchange="setAnswer('${h(item.id)}','rated',this.value)"><option value="">Select verified designation</option><option value="standard" ${o.rated==='standard'?'selected':''}>Standard</option><option value="long" ${o.rated==='long'?'selected':''}>Long stroke</option><option value="long3" ${o.rated==='long3'?'selected':''}>3-inch rated Type 20/24 only</option></select></div></div>`}if(item.type){let unit=item.type==='tread'?'/32 in': 'in';s+=`<div class="two" style="margin:10px 0"><div><label>${item.type==='stroke'?'Applied pushrod stroke':item.type==='tread'?'Lowest measured tread depth':'Minimum lining thickness'} (${unit})</label><input type="number" step="any" min="0" value="${h(o.value)}" oninput="setAnswer('${h(item.id)}','value',this.value)"></div><div><label>Measurement result</label><div class="pill" id="eval-${flat.indexOf(item)}">${resultText(item,o)}</div></div></div>`}return s}
function resultText(item,o){let t=evaluate(item,o);let l=item.type==='stroke'?limits(o.size,o.rated):null;return `<span class="${t==='fail'?'fail':t==='pass'?'pass':'warning'}">${t==='fail'?'BELOW / ABOVE DOT LIMIT — FAIL':t==='pass'?'MEETS THIS MEASURED LIMIT':'Select verified details / enter measurement'}</span>`+(l!==null?` (max ${l} in)`: '')}
function renderSection(reset=true){if(page!=='inspect')return;const region=$('#checklist');if(!region)return;let g=groups[section];region.innerHTML=`<div class="row spread"><h3>${section+1}. ${h(g.name)}</h3><span class="pill">${section+1} / ${groups.length}</span></div>${g.items.map((a,i)=>{let item=flat.find(x=>x.id===g.name+'|'+i),o=response(item.id);return `<div class="item"><div class="row spread"><div class="itemhead">${h(item.title)}</div><span class="pill ${o.status==='fail'?'fail':o.status==='pass'?'pass':''}">${o.status?h(o.status.toUpperCase()):'NOT CHECKED'}</span></div><details ${reset?'':'open'}><summary class="small" style="cursor:pointer;margin:8px 0;color:#b4d9f1">How to inspect • tools / limits • citation</summary><div class="guide"><b>Procedure:</b> ${h(item.how)}<br><br><b>Acceptance / limits:</b> ${h(item.spec)}<br><b>Reference:</b> ${h(item.ref)}</div></details>${fields(item,o)}<div class="row noprint"><button ${o.status==='pass'?'class="selected"':''} onclick="setAnswer('${h(item.id)}','status','pass')">✓ Pass</button><button ${o.status==='fail'?'class="selected"':''} onclick="setAnswer('${h(item.id)}','status','fail')">✕ Fail</button><button ${o.status==='na'?'class="selected"':''} onclick="setAnswer('${h(item.id)}','status','na')">N/A</button><button onclick="setAnswer('${h(item.id)}','status','')">Clear</button></div><div style="margin-top:10px"><label>Notes / deficiencies / measurement location</label><textarea oninput="setAnswer('${h(item.id)}','note',this.value)">${h(o.note)}</textarea></div><div class="row noprint"><label style="margin:0">Add photo (camera/gallery)</label><input style="width:220px" type="file" accept="image/*" capture="environment" onchange="addPhoto('${h(item.id)}',this)"></div><div>${(o.photos||[]).map((p,j)=>`<img class="photo" src="${p}" alt="Defect photo"><button class="noprint" onclick="removePhoto('${h(item.id)}',${j})">Remove photo ${j+1}</button>`).join('')}</div></div>`}).join('')}<div class="row spread noprint"><button onclick="section=Math.max(0,section-1);render()" ${section===0?'disabled':''}>← Previous</button><button class="primary" onclick="section=Math.min(groups.length-1,section+1);render()" ${section===groups.length-1?'disabled':''}>Next section →</button></div>`;
// Avoid resetting scroll and focus during measurement entry; update computed feedback in place.
if(!reset){return}}
async function addPhoto(id,inp){let f=inp.files?.[0];if(!f)return;let data=await compress(f);let o=draft.answers[id]||{status:'',value:'',note:'',photos:[]};o.photos=o.photos||[];o.photos.push(data);draft.answers[id]=o;await put('inspections',draft);render()}function compress(file){return new Promise((a,b)=>{let img=new Image(),reader=new FileReader();reader.onload=()=>{img.onload=()=>{let scale=Math.min(1,1100/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);a(c.toDataURL('image/jpeg',.7))};img.onerror=b;img.src=reader.result};reader.onerror=b;reader.readAsDataURL(file)})}function removePhoto(id,j){draft.answers[id].photos.splice(j,1);scheduleSave();render()}
function metadata(){return `<div class="grid"><div><label>Inspection type</label><select onchange="setField('type',this.value)"><option value="annual" ${draft.type==='annual'?'selected':''}>Annual DOT periodic inspection</option><option value="routine" ${draft.type==='routine'?'selected':''}>Routine maintenance inspection</option></select></div><div><label>Trailer number *</label><input value="${h(draft.trailer)}" placeholder="e.g. 102" oninput="setField('trailer',this.value)"></div><div><label>Trailer VIN *</label><input value="${h(draft.vin)}" placeholder="17-character VIN" oninput="setField('vin',this.value)"></div><div><label>Motor carrier / operator *</label><input value="${h(draft.carrier)}" oninput="setField('carrier',this.value)"></div><div><label>Inspector full name *</label><input value="${h(draft.inspector)}" oninput="setField('inspector',this.value)"></div><div><label>Annual inspector qualification reference</label><input value="${h(draft.qualification)}" placeholder="Training/experience record ID" oninput="setField('qualification',this.value)"></div></div>`}
function renderInspect(){let total=flat.length,done=answeredCount(draft),bad=failedCount(draft);$('#app').innerHTML=`<div class="card"><div class="row spread"><h2 class="heading">${draft.status==='complete'?'Completed inspection':'Inspection in progress'}</h2><span class="pill">${h(draft.type.toUpperCase())}</span></div>${metadata()}<div style="margin-top:14px" class="row spread"><b>${done} of ${total} checked</b><span class="${bad?'fail':'muted'}">${bad} failed</span></div><div class="progress"><div style="width:${100*done/total}%"></div></div><p class="notice">For an annual DOT report, every applicable item must be evaluated and the qualified inspector must certify it. This app is a documentation aid, not an authorization to conduct inspections.</p></div><div class="card"><div class="row noprint" style="margin-bottom:14px"><label style="margin:0">Jump to section</label><select class="compact" onchange="section=Number(this.value);render()">${groups.map((g,i)=>`<option value="${i}" ${i===section?'selected':''}>${i+1}. ${h(g.name)}</option>`).join('')}</select></div><div id="checklist"></div></div><div class="card"><h3>Inspection sign-off</h3><label>Certification / signature (type full name)</label><input value="${h(draft.signed)}" oninput="setField('signed',this.value)" placeholder="Inspector attests to report accuracy and completeness"><div class="row noprint" style="margin-top:15px"><button onclick="saveDraft()">Save draft</button><button class="primary" onclick="complete()">Finalize report</button><button onclick="window.print()">Print current inspection</button></div></div>`;renderSection()}
async function saveDraft(){await put('inspections',draft);alert('Draft saved on this device. Export backups regularly.')}async function complete(){let missing=flat.filter(x=>!response(x.id).status);if(!draft.trailer.trim()||!draft.vin.trim()||!draft.inspector.trim()||!draft.carrier.trim()||!draft.signed.trim())return alert('Complete trailer number, VIN, inspector, motor carrier and signature first.');if(missing.length)return alert(`You still have ${missing.length} unanswered checklist items.`);if(draft.type==='annual'&&!draft.qualification.trim())return alert('Enter the inspector qualification reference for an annual DOT report.');for(let x of flat.filter(x=>x.type)){let o=response(x.id),e=evaluate(x,o);if(o.status==='pass'&&e==='fail')return alert(`${x.title}: measurement violates limit; cannot mark PASS.`);if(o.status==='pass'&&e===null)return alert(`${x.title}: enter and verify the measurement and any chamber identification before PASS.`)}draft.status=failedCount(draft)?'failed':'complete';draft.completed=now();await put('inspections',draft);alert('Report saved locally. Export PDF/backup for retention and distribution.');page='records';render()}
async function render(){navUI();if(page==='inspect'){renderInspect();return}if(page==='home'){let rec=await getAll('inspections'),fleet=await getAll('trailers');$('#app').innerHTML=`<h2 class="heading">Inspection dashboard</h2><div class="grid"><div class="card"><div class="muted">Trailers recorded</div><h2>${fleet.length}</h2></div><div class="card"><div class="muted">Saved inspections</div><h2>${rec.length}</h2></div><div class="card"><div class="muted">Unfinished reports</div><h2>${rec.filter(x=>x.status==='draft').length}</h2></div><div class="card"><div class="muted">Reports with failures</div><h2>${rec.filter(x=>failedCount(x)).length}</h2></div></div><div class="card"><h3>Start your inspection</h3><p>Annual DOT periodic or routine maintenance. Guided instructions and measurements for air drum brake trailers.</p><button class="primary" onclick="startNew()">+ Start inspection</button></div><div class="card"><h3>Recent records</h3>${rec.sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,6).map(x=>`<div class="item row spread"><span>Trailer ${h(x.trailer||'Unassigned')} · ${h(x.type)} · ${h(x.status)}</span><button onclick="openRecord('${x.id}')">Open</button></div>`).join('')||'<p class="muted">No inspections yet.</p>'}</div>`;return}if(page==='fleet'){let f=await getAll('trailers');$('#app').innerHTML=`<h2 class="heading">Trailer fleet</h2><div class="card"><div class="two"><div><label>Unit number</label><input id="fleetUnit" placeholder="Trailer 102"></div><div><label>VIN</label><input id="fleetVin" placeholder="VIN"></div><div><label>Make / model</label><input id="fleetMake"></div><div><label>Year</label><input id="fleetYear" type="number"></div></div><div style="margin-top:10px"><button class="primary" onclick="addTrailer()">Add trailer</button></div></div><div class="card">${f.map(x=>`<div class="item row spread"><span><b>${h(x.id)}</b> · ${h(x.vin)} · ${h(x.make||'')} ${h(x.year||'')}</span><span><button onclick="inspectTrailer('${h(x.id)}')">Inspect</button> <button onclick="removeTrailer('${h(x.id)}')">Delete</button></span></div>`).join('')||'No trailers added.'}</div>`;return}if(page==='records'){let r=await getAll('inspections');$('#app').innerHTML=`<h2 class="heading">Saved reports & backups</h2><div class="card"><div class="row"><button class="primary" onclick="backup()">Export complete JSON backup</button><label class="btn" style="margin:0;cursor:pointer">Restore JSON backup <input type="file" accept="application/json,.json" style="display:none" onchange="restore(this)"></label></div><p class="small muted">Stored on this browser/device only. Clearing browser data can erase these records. Save backups to managed company storage. Restoring merges by record ID and overwrites matching IDs.</p></div><div class="card">${r.sort((a,b)=>b.updated.localeCompare(a.updated)).map(x=>`<div class="item row spread"><span><b>Trailer ${h(x.trailer||'—')}</b><br><span class="small muted">${h(x.type)} | ${new Date(x.created).toLocaleString()} | ${h(x.status)} | ${failedCount(x)} failures</span></span><span><button onclick="openRecord('${x.id}')">Open</button> <button onclick="printRecord('${x.id}')">Print/PDF</button> <button onclick="deleteRecord('${x.id}')">Delete</button></span></div>`).join('')||'<p>No inspections recorded.</p>'}</div>`;return}if(page==='info'){$('#app').innerHTML=`<h2 class="heading">Standards, use and limitations</h2><div class="card"><h3>Inspection scope</h3><p>Configured for dry van semi-trailers with air drum brakes. Annual DOT periodic reports follow Appendix A to Part 396 as the minimum baseline. Routine inspections can include additional fleet-maintenance items.</p><p>Federal annual periodic inspections must be performed by a qualified inspector, at least every 12 months. Keep annual reports for at least 14 months and maintain inspector qualification evidence as required.</p><p>Brake chamber table applies only to identified clamp-type chambers. Special 3-inch rated Type 20 / Type 24 chambers have distinct limits. Never assume the type or rated stroke. For unknown brake configuration, obtain manufacturer data and mark for further review.</p><p><b>Required records:</b> Annual DOT reports identify inspector, motor carrier, date, trailer, components/results, and inspector certification. Electronic records should be backed up and accessible for production to officials.</p><h3>Primary official/reference sources</h3><p><a target="_blank" href="https://www.ecfr.gov/current/title-49/subtitle-B/chapter-III/subchapter-B/part-396/appendix-Appendix%20A%20to%20Part%20396">49 CFR 396 Appendix A</a><br><a target="_blank" href="https://www.ecfr.gov/current/title-49/section-393.47">49 CFR 393.47 — Brakes</a><br><a target="_blank" href="https://www.ecfr.gov/current/title-49/section-393.75">49 CFR 393.75 — Tires</a><br><a target="_blank" href="https://www.ecfr.gov/current/title-49/section-396.17">49 CFR 396.17 — Periodic inspections</a><br><a target="_blank" href="https://www.ecfr.gov/current/title-49/section-396.19">49 CFR 396.19 — Inspector qualifications</a><br><a target="_blank" href="https://www.ecfr.gov/current/title-49/section-396.21">49 CFR 396.21 — Recordkeeping</a></p><p class="notice">Not a DVIR substitute, government-approved inspection certificate, roadside out-of-service classifier, or certified inspection training course. Manufacturer limits and fleet configuration must be verified.</p></div>`}}
async function addTrailer(){let id=$('#fleetUnit').value.trim(),vin=$('#fleetVin').value.trim();if(!id||!vin)return alert('Unit and VIN required.');await put('trailers',{id,vin,make:$('#fleetMake').value,year:$('#fleetYear').value});render()}async function inspectTrailer(id){let t=(await getAll('trailers')).find(x=>x.id===id);await startNew();draft.trailer=t.id;draft.vin=t.vin;render();scheduleSave()}async function removeTrailer(id){if(confirm('Delete trailer fleet entry? Past inspection records remain.')){await del('trailers',id);render()}}async function openRecord(id){let r=(await getAll('inspections')).find(x=>x.id===id);if(!r)return;draft=r;section=0;page='inspect';render()}async function deleteRecord(id){if(confirm('Permanently delete this inspection from this device?')){await del('inspections',id);render()}}
async function printRecord(id){let r=(await getAll('inspections')).find(x=>x.id===id);if(!r)return;let w=window.open('','_blank');if(!w)return alert('Enable popups to print PDF.');let rows=flat.map(item=>{let o=r.answers?.[item.id]||{};return `<tr><td>${h(item.group)} / ${h(item.title)}</td><td>${h(o.status||'Unanswered')}</td><td>${h(o.value||'')} ${item.type==='tread'?'/32 in':item.type?'in':''}</td><td>${h(o.note||'')}</td></tr>${(o.photos||[]).map(p=>`<tr><td colspan="4"><img style="max-width:260px;max-height:200px" src="${p}"></td></tr>`).join('')}`}).join('');w.document.write(`<!doctype html><html><head><title>APAC Inspection ${h(r.trailer)}</title><style>body{font:13px Arial;padding:24px;color:#111}table{border-collapse:collapse;width:100%}th,td{border:1px solid #777;padding:6px;vertical-align:top}tr{break-inside:avoid}h1{border-bottom:3px solid #b32f39}p{line-height:1.4}</style></head><body><h1>APAC · Trailer Inspection Report</h1><p><b>Type:</b> ${h(r.type)} &nbsp; <b>Status:</b> ${h(r.status)} &nbsp; <b>Date:</b> ${h(r.completed||r.created)}</p><p><b>Trailer:</b> ${h(r.trailer)} &nbsp; <b>VIN:</b> ${h(r.vin)} &nbsp; <b>Carrier:</b> ${h(r.carrier)}</p><p><b>Inspector:</b> ${h(r.inspector)} &nbsp; <b>Qualification record:</b> ${h(r.qualification)} &nbsp; <b>Inspector certification:</b> ${h(r.signed)}</p><p><b>Failures:</b> ${failedCount(r)} &nbsp; <b>Items completed:</b> ${answeredCount(r)} / ${flat.length}</p><table><thead><tr><th>Component</th><th>Result</th><th>Measurement</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table><p>Inspector certifies accuracy and completeness of this recorded report: ${h(r.signed)}. This digital report must be retained and made available as required by 49 CFR 396.21.</p></body></html>`);w.document.close();setTimeout(()=>w.print(),350)}
async function backup(){let payload={app:'APAC Trailer Inspection',version:1,exported:now(),inspections:await getAll('inspections'),trailers:await getAll('trailers')};let blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='APAC-Trailer-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function restore(inp){let f=inp.files?.[0];if(!f)return;try{let b=JSON.parse(await f.text());if(b.app!=='APAC Trailer Inspection'||!Array.isArray(b.inspections)||!Array.isArray(b.trailers))throw Error('Invalid format');if(!confirm(`Import ${b.inspections.length} inspections and ${b.trailers.length} trailers? Matching IDs will be overwritten.`))return;for(let t of b.trailers)await put('trailers',t);for(let r of b.inspections)await put('inspections',r);alert('Backup restored.');render()}catch(e){alert('Restore failed: '+e.message)}}

(async()=>{try{db=await dbOpen();statusOnline();render();if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(console.warn)}catch(e){$('#app').innerHTML='<div class="notice">This browser could not initialize IndexedDB. Use Chrome/Edge or install the app from an HTTPS host. '+h(e.message)+'</div>'}})();
